<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FDF7F3" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#17131F" media="(prefers-color-scheme:dark)">
<title>Nia</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#FDF7F3;--surface:#FFF;--ink:#2B2140;--ink-soft:#6B6280;--bloom:#C4577A;
--bloom-soft:#F6E2E8;--sage:#6E9478;--sage-soft:#E4EEE6;--mist:#EDE6F5;--line:#EBE2DC;--r:20px;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--canvas:#17131F;--surface:#211B2C;--ink:#F2ECF5;--ink-soft:#9F96AE;
--bloom:#E38AA8;--bloom-soft:#3A2430;--sage:#8FBA99;--sage-soft:#22301F;--mist:#2C2438;--line:#332B41}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--canvas);font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
display:flex;flex-direction:column;padding-top:var(--st)}
.appbar{height:52px;display:flex;align-items:center;gap:4px;padding:0 10px;flex:0 0 auto;border-bottom:1px solid transparent}
.appbar.sc{border-bottom-color:var(--line)}
.back{width:40px;height:40px;border:0;background:transparent;border-radius:50%;font-size:21px;color:var(--ink);
cursor:pointer;opacity:0;pointer-events:none;transition:.2s}
.back.on{opacity:1;pointer-events:auto}
.bt{font-size:14px;font-weight:700}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 40px;display:none}
.view.active{display:block}.view::-webkit-scrollbar{display:none}
body.app .view{padding-bottom:calc(96px + var(--sb))}
h1{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin:6px 0 4px;letter-spacing:-.5px;line-height:1.18}
.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;line-height:1.5}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:26px 0 10px}
.note{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin-top:12px}
.splash{position:fixed;inset:0;background:var(--canvas);z-index:60;display:flex;flex-direction:column;
align-items:center;justify-content:center}
.splash.out{animation:fo .5s forwards}
.lg{width:104px;height:104px;transform:rotate(-90deg)}
.lr{stroke-dasharray:289;stroke-dashoffset:289;animation:dr 1s .1s cubic-bezier(.4,0,.2,1) forwards}
.lf{opacity:0;transform-origin:60px 60px;animation:bl .7s .7s cubic-bezier(.3,.9,.3,1) forwards}
.ld{opacity:0;animation:pp .45s 1.25s cubic-bezier(.3,1.4,.4,1) forwards}
.wm{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin-top:24px;opacity:0;animation:ri .6s 1.15s forwards}
.tg{font-size:12px;color:var(--ink-soft);opacity:0;animation:ri .6s 1.35s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes bl{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes pp{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes ri{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes fo{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.splash *{animation-duration:.01s!important}}
.prog{height:3px;background:var(--line);border-radius:9px;margin:4px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--bloom);transition:.35s}
.pick{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:9px;
cursor:pointer;display:flex;align-items:center;gap:13px}
.pick.on{border-color:var(--bloom);background:var(--bloom-soft)}
.pick .ic{font-size:19px;width:24px;text-align:center}
.pick b{display:block;font-size:14.5px}.pick small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;
font-family:'DM Sans';font-size:16px;color:var(--ink);margin-bottom:10px}
.inp:focus{outline:0;border-color:var(--bloom)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.stepper b{font-family:'Fraunces',serif;font-size:26px}
.stepper small{font-size:12px;color:var(--ink-soft);display:block}
.sbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--canvas);
font-size:20px;color:var(--ink);cursor:pointer;line-height:1}
.cta{width:100%;background:var(--ink);color:var(--canvas);border:0;border-radius:var(--r);padding:17px;
font-family:'DM Sans';font-size:15px;font-weight:700;margin-top:16px;cursor:pointer}
.cta:disabled{opacity:.3}
.cta.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);margin-top:8px}
.hero{text-align:center;padding:30px 6px 0}
.heroico{width:88px;height:88px;border-radius:50%;background:var(--bloom-soft);color:var(--bloom);
display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 22px}
.dial-wrap{position:relative;display:flex;justify-content:center;margin:4px 0}
svg.dial{width:270px;height:270px;transform:rotate(-90deg)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dn{font-family:'Fraunces',serif;font-size:60px;line-height:.9;font-weight:600;letter-spacing:-2px}
.dl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-top:8px}
.pp{margin-top:13px;background:var(--bloom-soft);color:var(--bloom);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px}
.quickrow{display:flex;gap:7px;margin-top:12px}
.q{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 2px;text-align:center;cursor:pointer}
.q.on{border-color:var(--bloom);background:var(--bloom-soft)}
.q i{font-style:normal;font-size:19px;display:block}
.q span{font-size:9px;color:var(--ink-soft);font-weight:600;display:block;margin-top:4px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line);margin-bottom:11px}
.card h3{margin:0 0 6px;font-size:15px}.card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calhead div{text-align:center;font-size:10px;color:var(--ink-soft);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13px;cursor:pointer;position:relative}
.cd.off{opacity:.25}.cd.period{background:var(--bloom);color:#fff;font-weight:700}
.cd.pred{background:var(--bloom-soft);color:var(--bloom);font-weight:600}
.cd.fert{background:var(--sage-soft);color:var(--sage);font-weight:600}
.cd.ovu{box-shadow:inset 0 0 0 2px var(--sage);color:var(--sage);font-weight:700}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cd.dot::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav button{width:38px;height:38px;border:0;background:transparent;font-size:19px;color:var(--ink-soft);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:16px}
.legend span{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:7px;height:105px;margin:14px 0 6px}
.bar{flex:1;background:var(--mist);border-radius:6px 6px 0 0;min-height:4px}.bar.hi{background:var(--bloom)}
.barlbl{display:flex;gap:7px}.barlbl div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-soft)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.stat:last-child{border:0}.stat b{font-family:'Fraunces',serif;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);
border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:8px;cursor:pointer}
.row .t{font-size:14px}.row .d{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.toggle{width:44px;height:26px;background:#DDD4CE;border-radius:99px;position:relative;flex:0 0 auto;transition:.2s}
@media(prefers-color-scheme:dark){.toggle{background:#3C3348}}
.toggle.on{background:var(--sage)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:21px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--canvas);border-radius:28px 28px 0 0;
padding:10px 20px calc(28px + var(--sb));transform:translateY(100%);transition:.3s cubic-bezier(.3,.8,.3,1);
z-index:41;max-height:85%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 16px}
.opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:12.5px;cursor:pointer}
.opt.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(78px + var(--sb));background:var(--canvas);
border-top:1px solid var(--line);display:none;padding-bottom:var(--sb);z-index:30}
body.app .nav{display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);cursor:pointer;position:relative}
.nb.on{color:var(--bloom)}.nb i{font-style:normal;font-size:19px}.nb span{font-size:9.5px;font-weight:600}
.badge{background:var(--sage);color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:99px;position:absolute;top:8px;left:52%}
.toast{position:fixed;bottom:calc(100px + var(--sb));left:50%;transform:translateX(-50%) translateY(16px);
background:var(--ink);color:var(--canvas);padding:12px 20px;border-radius:14px;font-size:13px;opacity:0;
transition:.3s;z-index:50;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="splash" id="splash">
  <svg class="lg" viewBox="0 0 120 120">
    <circle class="lr" cx="60" cy="60" r="46" fill="none" stroke="#EBD5DD" stroke-width="3"/>
    <path class="lf" d="M60 14a46 46 0 0 0 0 92z" fill="#C4577A"/>
    <circle class="ld" cx="60" cy="14" r="6" fill="#2B2140"/>
  </svg>
  <div class="wm">Nia</div>
  <div class="tg" id="tagline"></div>
</div>

<div class="appbar" id="appbar">
  <button class="back" id="backBtn">←</button><span class="bt" id="barTitle"></span>
</div>

<div class="view" id="vlang"></div>
<div class="view" id="vpw"></div>
<div class="view" id="v0"></div>
<div class="view" id="v1"></div>
<div class="view" id="v2"></div>
<div class="view" id="v3"></div>
<div class="view" id="v4"></div>
<div class="view" id="v5"></div>
<div class="view" id="v6"></div>
<div class="view" id="v7"></div>
<div class="view" id="home"></div>
<div class="view" id="calv"></div>
<div class="view" id="insv"></div>
<div class="view" id="chatv"></div>
<div class="view" id="setv"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div class="nav" id="nav"></div>

<script src="app.js"></script>
</body>
</html>
