name: Build Android (AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build purchases bridge
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
        run: |
          if [ -z "$RC_ANDROID_KEY" ]; then echo "Secret RC_ANDROID_KEY is missing"; exit 1; fi
          npm run build:rc
          sed -i "s|__RC_ANDROID_KEY__|$RC_ANDROID_KEY|" www/app.js
          grep -c "__RC_ANDROID_KEY__" www/app.js && exit 1 || echo "RevenueCat key set"

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FDF7F3' --splashBackgroundColor '#FDF7F3' --splashBackgroundColorDark '#17131F'
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          npx cap build android \
            --androidreleasetype AAB \
            --keystorepath $RUNNER_TEMP/upload.jks \
            --keystorepass "$KEYSTORE_PASSWORD" \
            --keystorealias nia \
            --keystorealiaspass "$KEYSTORE_PASSWORD"
          find android -name "*.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nia-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
